apiVersion: v1
kind: Namespace
metadata:
  name: reddit-app

apiVersion: apps/v1
kind: Deployment
metadata:
  name: reddit-app
  namespace: reddit-app 
  labels:
    app: reddit
spec:
  replicas: 5
  selector:
    matchLabels:
      app: reddit
  template:
    metadata:
      labels:
        app: reddit
    spec:
      containers:
        - name: cont1
          image: satya1541/netflix_static:latest
          ports:
            - containerPort: 80  
          livenessProbe:
            httpGet:
              path: /
              port: 80  
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80  
            initialDelaySeconds: 3
            periodSeconds: 5

apiVersion: v1
kind: Service
metadata:
  name: reddit-app
  namespace: reddit-app  
spec:
  type: LoadBalancer  
  selector:
    app: reddit
  ports:
    - port: 80           
      targetPort: 80
