apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: netflix-app
  labels:
    app: netflix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: cont1
          image: satya1541/netflix_java:latest
          ports:
            - containerPort: 8080 
          livenessProbe:
            httpGet:
              path: /
              port: 8080 
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080 
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  namespace: netflix-app
spec:
  type: LoadBalancer
  selector:
    app: netflix
  ports:
    - port: 80        
      targetPort: 8080  
