# Namespace Configuration
apiVersion: v1
kind: Namespace
metadata:
  name: reddit-app

---
# Deployment Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reddit-app
  namespace: reddit-app 
  labels:
    app: reddit
spec:
  replicas: 5
  selector:
    matchLabels:
      app: reddit
  template:
    metadata:
      labels:
        app: reddit
    spec:
      containers:
        - name: cont1
          image: satya1541/reddit:latest
          ports:
            - containerPort: 3000  
          livenessProbe:
            httpGet:
              path: /
              port: 3000  
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000  
            initialDelaySeconds: 3
            periodSeconds: 5

---
# Service Configuration
apiVersion: v1
kind: Service
metadata:
  name: reddit-app
  namespace: reddit-app  
spec:
  type: LoadBalancer  
  selector:
    app: reddit
  ports:
    - port: 80           
      targetPort: 3000
