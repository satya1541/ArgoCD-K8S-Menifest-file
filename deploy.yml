apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: default 
  labels:
    app: netflix
spec:
  replicas: 5
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: cont1
          image: satya1541/whatsapp_static:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  namespace: default 
spec:
  type: LoadBalancer
  selector:
    app: netflix
  ports:
    - port: 80
      targetPort: 80
