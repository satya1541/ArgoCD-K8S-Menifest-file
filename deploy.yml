apiVersion: v1
kind: Namespace
metadata:
  name: prime-app

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-app
  namespace: prime-app 
  labels:
    app: prime
spec:
  replicas: 20
  selector:
    matchLabels:
      app: prime
  template:
    metadata:
      labels:
        app: prime
    spec:
      containers:
        - name: cont1
          image: satya1541/prime_videos:latest
          ports:
            - containerPort: 80  
          livenessProbe:
            httpGet:
              path: /
              port: 80  
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80  
            initialDelaySeconds: 3
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: prime-app
  namespace: prime-app  
spec:
  type: LoadBalancer  
  selector:
    app: prime
  ports:
    - port: 80
      targetPort: 80
