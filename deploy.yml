apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-app
  namespace: spotify-app
  labels:
    app: spotify
spec:
  replicas: 3  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: spotify
  template:
    metadata:
      labels:
        app: spotify
    spec:
      containers:
        - name: spotify-container
          image: satya1541/spotify-clone:latest
          ports:
            - containerPort: 8080 
          resources:
            requests:
              cpu: "500m"   
              memory: "512Mi"  
            limits:
              cpu: "1000m" 
              memory: "1Gi" 
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080 
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-app
  namespace: spotify-app
spec:
  type: LoadBalancer
  selector:
    app: spotify
  ports:
    - name: http
      port: 80        
      targetPort: 8080
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spotify-app-hpa
  namespace: spotify-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spotify-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: 750Mi 
