apiVersion: v1
kind: Namespace
metadata:
  name: netflix-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: netflix-app
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /healthz {
            access_log off;
            return 200 "OK";
        }

        location /ready {
            access_log off;
            return 200 "OK";
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: netflix-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      securityContext:
        fsGroup: 101  
      containers:
        - name: netflix-container
          image: satya1541/netflix_static:latest
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 0  
            runAsNonRoot: false
            readOnlyRootFilesystem: false 
          volumeMounts:
            - name: nginx-run
              mountPath: /var/run 
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/
              readOnly: true
      volumes:
        - name: nginx-run
          emptyDir: {} 
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-config-volume
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  namespace: netflix-app
spec:
  type: LoadBalancer  
  selector:
    app: netflix
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netflix-ingress
  namespace: netflix-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: netflix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netflix-app
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netflix-app-hpa
  namespace: netflix-app
spec:
  scaleTargetRef:
    kind: Deployment
    name: netflix-app
    apiVersion: apps/v1
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netflix-app-pdb
  namespace: netflix-app
spec:
  maxUnavailable: 1  
  selector:
    matchLabels:
      app: netflix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netflix-network-policy
  namespace: netflix-app
spec:
  podSelector:
    matchLabels:
      app: netflix
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0  
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: external-services
      ports:
        - protocol: TCP
          port: 443 
        - protocol: UDP  
          port: 53       
