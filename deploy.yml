apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-app
  namespace: default 
  labels:
    app: yt
spec:
  replicas: 10
  selector:
    matchLabels:
      app: yt
  template:
    metadata:
      labels:
        app: yt
    spec:
      containers:
        - name: cont1
          image: satya1541/youtube-clone-app:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yt-app
  namespace: default 
spec:
  type: LoadBalancer
  selector:
    app: yt
  ports:
    - port: 80
      targetPort: 80
