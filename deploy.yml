apiVersion: v1
kind: Namespace
metadata:
  name: netflix-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: netflix-app
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        sendfile on;
        keepalive_timeout 65;

        server {
            listen 8080;
            server_name netflix.example.com;

            location / {
                root /usr/share/nginx/html;
                index index.html;
            }

            location /healthz {
                return 200 'healthy';
            }

            location /ready {
                return 200 'ready';
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: netflix-app
  labels:
    app: netflix
spec:
  replicas: 3
  selector:
    matchLabels:
      app: netflix
  template:
    metadata:
      labels:
        app: netflix
    spec:
      containers:
        - name: netflix-container
          image: satya1541/netflix_static:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            readOnlyRootFilesystem: false 
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-app
  namespace: netflix-app
spec:
  type: LoadBalancer 
  selector:
    app: netflix
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netflix-ingress
  namespace: netflix-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: netflix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netflix-app
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: netflix-app-hpa
  namespace: netflix-app
spec:
  scaleTargetRef:
    kind: Deployment
    name: netflix-app
    apiVersion: apps/v1
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: netflix-app-pdb
  namespace: netflix-app
spec:
  maxUnavailable: 1  
  selector:
    matchLabels:
      app: netflix
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netflix-network-policy
  namespace: netflix-app
spec:
  podSelector:
    matchLabels:
      app: netflix
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0  
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: external-services
      ports:
        - protocol: TCP
          port: 443 
        - protocol: UDP  
          port: 53
