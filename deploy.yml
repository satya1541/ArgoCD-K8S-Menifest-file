apiVersion: apps/v1
kind: Deployment
metadata:
  name: love-app
  namespace: random-app
  labels:
    app: love
spec:
  replicas: 7
  selector:
    matchLabels:
      app: love
  template:
    metadata:
      labels:
        app: love
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: love
      containers:
        - name: love-container
          image: satya1541/love:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: love-app
  namespace: love-app
spec:
  type: LoadBalancer
  selector:
    app: love
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: love-app-hpa
  namespace: love-app
spec:
  scaleTargetRef:
    kind: Deployment
    name: love-app
    apiVersion: apps/v1
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: love-app-pdb
  namespace: love-app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: love 
